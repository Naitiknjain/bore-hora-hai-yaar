# Supabase pauses free-plan projects after 7 days without activity, which takes the whole site's
# online features down. This runs one tiny read-only query twice a week so the project stays active.
# Secrets (repository settings): SUPABASE_URL and SUPABASE_ANON_KEY - the same public values as Netlify's
# VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY. Never use the service-role key here.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * 1,4' # Mondays and Thursdays 06:17 UTC (twice a week, well inside the 7-day window)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database once
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set"
            exit 1
          fi
          # public leaderboard read (allowed for the anon role); the response body is not printed
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/get_leaderboard" \
              -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
              -d '{"p_game":"memory-match","p_board":"easy","p_limit":1}')
            echo "attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "::error::Supabase did not answer with 200 - the project may be paused; restore it in the Supabase dashboard"
          exit 1
